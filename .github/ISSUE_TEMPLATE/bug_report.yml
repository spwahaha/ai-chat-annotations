name: Bug report
description: Report a reproducible problem without sharing private chat content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste private conversations, credentials, cookies, or authentication tokens.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [ChatGPT, Gemini]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Extension and Chrome versions
      placeholder: Extension 0.1.0; Chrome 153
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
